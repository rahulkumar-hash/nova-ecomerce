<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=64" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Single-Vendor Multi-Category Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem("adminStoreTheme") || localStorage.getItem("storeTheme");
          if (savedTheme) {
            var theme = JSON.parse(savedTheme);
            var root = document.documentElement;
            if (theme.primaryColor) root.style.setProperty("--color-primary", theme.primaryColor);
            if (theme.primaryHover) root.style.setProperty("--color-primary-hover", theme.primaryHover);
            if (theme.primaryLight) root.style.setProperty("--color-primary-light", theme.primaryLight);
            if (theme.secondaryColor) root.style.setProperty("--color-secondary", theme.secondaryColor);
            if (theme.accentColor) root.style.setProperty("--color-accent", theme.accentColor);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { background-color: #0b0f19; color: #f1f5f9; color-scheme: dark; }
    </style>
  </head>
  <body class="bg-[#0b0f19] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
