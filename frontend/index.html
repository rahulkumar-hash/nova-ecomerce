    <!-- Instant Anti-FOUC Theme Restoration Script -->
    <script>
      (function() {
        try {
          var savedMode = localStorage.getItem("themeMode");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = savedMode !== null ? savedMode === "dark" : prefersDark;
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }

          var savedTheme = localStorage.getItem("storeTheme");
          if (savedTheme) {
            var theme = JSON.parse(savedTheme);
            var root = document.documentElement;
            if (theme.primaryColor) root.style.setProperty("--color-primary", theme.primaryColor);
            if (theme.primaryHover) root.style.setProperty("--color-primary-hover", theme.primaryHover);
            if (theme.primaryLight) root.style.setProperty("--color-primary-light", theme.primaryLight);
            if (theme.secondaryColor) root.style.setProperty("--color-secondary", theme.secondaryColor);
            if (theme.accentColor) root.style.setProperty("--color-accent", theme.accentColor);
          }
        } catch (e) {}

        // Suppress browser automatic WebAPK prompt: ensure users only download/install the official native APK
        window.addEventListener("beforeinstallprompt", function(e) {
          e.preventDefault();
        });
      })();
    </script>
    <style>
      html { background-color: #fafafa; }
      html.dark { background-color: #090d16; }
      body { background-color: inherit; }

      /* Prevent browser dark-mode safety mechanism from painting opaque white background on Razorpay iframe */
      iframe,
      .razorpay-container,
      .razorpay-container > iframe,
      iframe.razorpay-checkout-frame,
      iframe[src*="razorpay"] {
        color-scheme: light !important;
        background: transparent !important;
        background-color: transparent !important;
      }
      .razorpay-container {
        background-color: rgba(15, 23, 42, 0.75) !important;
        backdrop-filter: blur(8px) !important;
        -webkit-backdrop-filter: blur(8px) !important;
      }
      /* Critical Hero & Layout Geometry (Prevents FCP delay & layout shift) */
      .h-\[320px\] { height: 320px; }
      @media (min-width: 640px) {

      }
      @media (min-width: 768px) {
        .md\:h-\[480px\] { height: 480px; }
      }
    </style>
